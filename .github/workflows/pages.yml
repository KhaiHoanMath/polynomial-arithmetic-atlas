name: Publish the atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check comments and content validation
        run: node --test scripts/comments.test.mjs scripts/content-validation.test.mjs
      - run: npm run build
      - run: npm run check
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install sympy==1.14.0
      - name: Check exact examples
        run: |
          python scripts/atlas_certificates.py --check
          python scripts/review_certificates.py
          python scripts/open_problem_certificates.py
          python scripts/literature_certificates.py
          python scripts/generate_eulerian.py --check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify published pages and removed files
        run: python scripts/verify-live.py
